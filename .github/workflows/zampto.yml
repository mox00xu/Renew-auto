name: Zampto Auto Renew

on:
  schedule:
    - cron: '25 1 * * *'  
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      ZAMPTO_EMAIL:      ${{ secrets.ZAMPTO_EMAIL }}
      ZAMPTO_PASSWORD:   ${{ secrets.ZAMPTO_PASSWORD }}
      ZAMPTO_SERVER_IDS: ${{ secrets.ZAMPTO_SERVER_IDS }}
      ZAMPTO_ACCOUNTS:   ${{ secrets.ZAMPTO_ACCOUNTS }}
      XRAY_VLESS:        ${{ secrets.XRAY_VLESS }}
      TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: 📥 检出私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: scripts
          sparse-checkout: Zampto_private_re
          sparse-checkout-cone-mode: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 📦 Install Python dependencies
        run: pip install -r scripts/Zampto_private_re/requirements.txt

      - name: ⚡ Install Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - name: 🚀 Run renew script
        run: |
          cd scripts/Zampto_private_re
          python3 renew.py
